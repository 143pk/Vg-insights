<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@900&amp;display=swap');
      .icon-title {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 230px;
        letter-spacing: -6px;
      }
    </style>
    <linearGradient id="bgIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="vGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#38BDF8" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgIcon)" />

  <g transform="translate(0, 0)" filter="url(#iconGlow)">
    <!-- Lightbulb above VG -->
    <g transform="translate(256, 120)">
      <line x1="0" y1="-32" x2="0" y2="-20" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
      <line x1="-24" y1="-24" x2="-15" y2="-15" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
      <line x1="24" y1="-24" x2="15" y2="-15" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
      <line x1="-30" y1="-3" x2="-18" y2="-3" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
      <line x1="30" y1="-3" x2="18" y2="-3" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />

      <path d="M-15 -4 C-22 -12 -19 -24 -7 -28 C4 -32 16 -26 18 -15 C19 -8 15 -3 11 3 C8 7 8 11 8 14 L-8 14 C-8 11 -8 7 -11 3 Z" fill="#0B132B" stroke="#38BDF8" stroke-width="6" stroke-linejoin="round" />
      <line x1="-6" y1="19" x2="6" y2="19" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- VG Typography -->
    <text x="256" y="375" class="icon-title" text-anchor="middle">
      <tspan fill="url(#vGradIcon)">V</tspan><tspan fill="#FFFFFF" dx="-8">G</tspan>
    </text>
  </g>
</svg>