# Netlify Continuous Deployment Configuration
# Automatically triggered on every 'git push' to GitHub

[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# 1. Netlify Serverless Functions for all backend API endpoints
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# 2. Single-Page Application (SPA) routing for all frontend routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache Control: Always fetch fresh HTML on update, cache immutable assets
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
